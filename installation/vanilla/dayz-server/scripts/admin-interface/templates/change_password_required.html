<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troca de Senha Obrigatória - DayZ Admin Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .change-password-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .alert-icon {
            font-size: 48px;
            color: #f0ad4e;
            margin-bottom: 20px;
        }
        .password-requirements {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="change-password-card">
        <div class="text-center mb-4">
            <i class="fas fa-key alert-icon"></i>
            <h2 class="mb-1">Troca de Senha Obrigatória</h2>
            <p class="text-muted">Por segurança, você deve alterar sua senha no primeiro acesso</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <div class="alert alert-info mb-4">
            <i class="fas fa-info-circle me-2"></i>
            <strong>Atenção:</strong> Escolha uma senha forte com no mínimo 8 caracteres.
        </div>

        <form method="POST" action="{{ url_for('change_password_required') }}" id="passwordForm">
            <div class="mb-3">
                <label for="current_password" class="form-label">
                    <i class="fas fa-lock me-2"></i>Senha Atual
                </label>
                <input type="password" class="form-control" id="current_password" name="current_password" required autofocus>
            </div>
            
            <div class="mb-3">
                <label for="new_password" class="form-label">
                    <i class="fas fa-lock me-2"></i>Nova Senha
                </label>
                <input type="password" class="form-control" id="new_password" name="new_password" required>
                <div class="password-requirements">
                    <i class="fas fa-check-circle me-1"></i> Mínimo 8 caracteres
                </div>
            </div>
            
            <div class="mb-4">
                <label for="confirm_password" class="form-label">
                    <i class="fas fa-lock me-2"></i>Confirmar Nova Senha
                </label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn btn-warning w-100">
                <i class="fas fa-key me-2"></i>Alterar Senha
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">
                <i class="fas fa-shield-alt me-1"></i>
                Por motivos de segurança, você não poderá acessar o sistema até alterar sua senha.
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validação client-side
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (newPassword.length < 8) {
                e.preventDefault();
                alert('A senha deve ter no mínimo 8 caracteres');
                document.getElementById('new_password').focus();
                return false;
            }
            
            if (newPassword !== confirmPassword) {
                e.preventDefault();
                alert('As senhas não coincidem');
                document.getElementById('confirm_password').focus();
                return false;
            }
        });
    </script>
</body>
</html>
