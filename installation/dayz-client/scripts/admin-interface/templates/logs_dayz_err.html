{% extends "base.html" %}

{% block title %}{{ log_title }} - DayZ Admin Interface{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="fas fa-bug me-2"></i>{{ log_title }}
    </h1>
</div>

<div class="card">
    <div class="card-body">
        <div class="log-stream-wrapper" data-log-stream="{{ log_stream }}">
            <div class="log-stream-toolbar">
                <span class="log-stream-path">
                    <i class="fas fa-file-alt me-2"></i>{{ log_path }}
                </span>
                <span class="log-stream-status" data-log-status>Conectando...</span>
            </div>
            <div class="log-stream-output" data-log-output></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/logs_stream.js') }}"></script>
{% endblock %}
