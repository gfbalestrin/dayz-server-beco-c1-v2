<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DayZ Admin Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 420px;
            width: 100%;
        }
        .login-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }
        .server-highlight {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-alt login-icon"></i>
            <h2 class="mb-1">DayZ Admin</h2>
            <p class="text-muted">Beco Gaming - Painel Administrativo</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="fas fa-user me-2"></i>Usuário
                </label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="fas fa-lock me-2"></i>Senha
                </label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">
                <i class="fas fa-sign-in-alt me-2"></i>Entrar
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <div class="text-center">
                <p class="text-muted small mb-2"><strong>Novo por aqui?</strong></p>
                
                <div class="server-highlight text-start mb-3">
                    <i class="fas fa-info-circle me-1 text-primary"></i>
                    Para registrar-se, primeiro jogue em nosso servidor:
                    <div class="mt-2 p-2 bg-dark text-white rounded font-monospace fw-bold text-center small">
                        [BR] BECO-C1 | 1PP DEATHMATCH
                    </div>
                </div>

                <p class="text-muted small mb-3">Após ser identificado no servidor, autentique-se:</p>
                <a href="{{ url_for('auth.steam_login') }}">
                    <img src="https://community.cloudflare.steamstatic.com/public/images/signinthroughsteam/sits_01.png" 
                         alt="Entrar com Steam" style="transition: transform 0.2s;">
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
